name: Build & Publish Fork Image to GHCR

# Builds the OmniRoute Docker image on GitHub-hosted runners and pushes it to
# THIS fork's own GHCR namespace (ghcr.io/<fork-owner>/omniroute, derived from
# github.repository_owner so a repo transfer cannot point it at a stale
# namespace). The
# Contabo VPS then `docker pull`s the image instead of building it locally.
#
# Why: the local `next build` / Turbopack phase reaches ~14 GiB RSS and was
# globally OOM-killing the swap-less Contabo host (taking unrelated processes
# with it). GitHub-hosted runners (16 GB RAM + gha cache) build this same
# Dockerfile comfortably, and minutes are free for this public repo. See the
# 2026-08-05 deploy investigation for the kernel-log proof.
#
# Target: runner-cli (the superset — Chromium/Playwright + bundled CLIs),
# matching docker-compose.prod.yml. Arch: linux/amd64 only (the VPS is amd64;
# arm64 would double CI time for an image the host can't run).

on:
  push:
    branches: [patty, custom-features, main]
    tags:
      - "v*"
  workflow_dispatch:

# Least-privilege default: read-only at the top level. The build job grants
# packages: write to itself (Scorecard TokenPermissions).
permissions:
  contents: read

# Cancel a superseded in-flight build on the same ref (free minutes, but no
# point publishing two images from a rapid push sequence).
concurrency:
  group: build-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  # Derived from the repo owner on purpose. The fork has been transferred twice
  # (patrickrho-patty → patty-internal 2026-08, then back to patrickrho-patty
  # 2026-10); each transfer silently redirected this literal to a namespace the
  # repo's GITHUB_TOKEN could no longer push to.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/omniroute

jobs:
  build:
    name: Build and push (amd64)
    # Only ever run on the fork — never on upstream diegosouzapw/OmniRoute.
    # Deliberately a NEGATIVE test against upstream, not an equality check on
    # this fork's slug. An equality check broke silently on both transfers
    # (patrickrho-patty → patty-internal 2026-08; back 2026-10): github.repository
    # stopped matching and every build was skipped with no failure to notice.
    # Upstream has no copy of this file, so "not upstream" is the whole rule and
    # no future transfer can break it.
    if: github.repository != 'diegosouzapw/OmniRoute'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # :latest tracks the fork's live deploy branch (patty since 2026-08-25;
          # custom-features before that). A short-sha tag is always produced for
          # traceability, plus per-branch and per-tag tags.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/patty' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=omniroute
            org.opencontainers.image.description=OmniRoute fork image — CI-built, pulled by the Contabo VPS (no local build)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # ── Host-side Next build (2026-09-24 restructure) ─────────────────────────
      # The in-Docker build OOMs the 16 GB runner since v3.8.51 (buildkit's own
      # tax on top of next build's ~10 GB peak: 2× V8 procs + Turbopack native).
      # Build on the host instead (full 16 GB, no buildkit), then substitute the
      # builder STAGE with the prebuilt tree via a named build context — the
      # Dockerfile itself is untouched, runner-cli still assembles the image.
      - name: Set up Node 26 (matches the image's node:26-trixie base)
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      # The 16 GB hosted runner OOM-kills the job silently (logs end with
      # "The operation was canceled" mid-compile). An 8 GB swapfile lets V8 GC
      # breathe through the prerender peak instead of dying.
      - name: Add swap space for the build
        run: |
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build standalone bundle on the host
        env:
          # Mirror the Dockerfile builder-stage env exactly (stub manager,
          # 1 page-data worker, raised heap) so the traced bundle is identical.
          OMNIROUTE_MITM_STUB: "1"
          CIRCLE_NODE_TOTAL: "2"
          NODE_OPTIONS: --max-old-space-size=6144
          DATA_DIR: ${{ github.workspace }}/data
        run: |
          mkdir -p data
          npm ci --no-audit --no-fund
          npm run build
          # Same standalone-verification the Dockerfile builder RUN performs.
          node --input-type=module -e "import { createRequire } from 'node:module'; import { pathToFileURL } from 'node:url'; const standaloneRoot = process.cwd() + '/.build/next/standalone/node_modules/'; const require = createRequire(process.cwd() + '/.build/next/standalone/package.json'); for (const pkg of ['@atjsh/llmlingua-2', '@huggingface/transformers', 'js-tiktoken']) { const resolved = require.resolve(pkg); if (!resolved.startsWith(standaloneRoot)) throw new Error(pkg + ' resolved outside standalone: ' + resolved); await import(pathToFileURL(resolved).href); } const onnxRuntime = require.resolve('onnxruntime-node'); if (!onnxRuntime.startsWith(standaloneRoot)) throw new Error('onnxruntime-node resolved outside standalone: ' + onnxRuntime); await import(pathToFileURL(onnxRuntime).href);"

      - name: Assemble builder-stage replacement tree
        run: |
          mkdir -p ci-builder/app/.build/next ci-builder/app/node_modules ci-builder/app/scripts/dev
          cp -a .build/next/standalone ci-builder/app/.build/next/standalone
          cp -a node_modules/better-sqlite3 node_modules/playwright node_modules/playwright-core ci-builder/app/node_modules/
          # The gyp-built native lands in the STANDALONE tree during npm run
          # build; runner-base's `test -f build/Release/better_sqlite3.node`
          # checks the node_modules copy — mirror it there (fall back to the
          # prebuilt linux binary when host gyp didn't produce one).
          if [ -f .build/next/standalone/node_modules/better-sqlite3/build/Release/better_sqlite3.node ]; then
            mkdir -p ci-builder/app/node_modules/better-sqlite3/build/Release
            cp -a .build/next/standalone/node_modules/better-sqlite3/build/Release/better_sqlite3.node ci-builder/app/node_modules/better-sqlite3/build/Release/
          elif [ -f ci-builder/app/node_modules/better-sqlite3/prebuilds/linux-x64.node ]; then
            mkdir -p ci-builder/app/node_modules/better-sqlite3/build/Release
            cp -a ci-builder/app/node_modules/better-sqlite3/prebuilds/linux-x64.node ci-builder/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node
          fi
          test -f ci-builder/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node
          cp -a scripts/dev/healthcheck.mjs ci-builder/app/scripts/dev/healthcheck.mjs
          du -sh ci-builder

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-cli
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Replace the builder stage with the host-built tree (see the steps
          # above); every COPY --from=builder path resolves from ci-builder/.
          build-contexts: |
            builder=ci-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
